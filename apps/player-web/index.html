<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GalCraft Player</title></head>
  <body>
    <main id="app"></main>
    <section id="file-open-help" hidden aria-labelledby="file-open-title">
      <p class="file-open-brand">GalCraft Player</p>
      <h1 id="file-open-title">请通过 HTTP 打开游戏</h1>
      <p id="file-open-reason">直接双击 index.html 时，浏览器会限制游戏脚本和素材的读取。</p>
      <ol>
        <li id="file-open-start">回到发行目录，双击 preview.cmd，自动启动本地预览并打开浏览器。</li>
        <li id="file-open-requirement">本地预览需要安装 Node.js。运行期间保持预览窗口开启，结束时关闭窗口或按 Ctrl+C。</li>
        <li id="file-open-hosting">也可以将整个发行目录部署到静态网站，通过 HTTP 或 HTTPS 地址访问。</li>
      </ol>
      <a id="file-open-readme" href="./README.html">查看运行说明</a>
    </section>
    <style>
      html[data-local-file] body { margin: 0; min-height: 100vh; background: #f5f7fa; color: #293747; font: 16px/1.7 system-ui, sans-serif; }
      #file-open-help[hidden] { display: none; }
      #file-open-help { box-sizing: border-box; width: min(680px, calc(100% - 32px)); margin: 8vh auto; padding: clamp(24px, 5vw, 44px); background: #fff; border: 1px solid #d9e1ea; border-radius: 12px; overflow-wrap: anywhere; }
      #file-open-help .file-open-brand { font-size: 14px; color: #576b80; }
      #file-open-help h1 { font-size: clamp(24px, 5vw, 30px); line-height: 1.3; }
      #file-open-help ol { padding-left: 24px; }
      #file-open-help li { margin-bottom: 12px; }
      #file-open-help a { color: #1764a5; text-underline-offset: 4px; }
      #file-open-help a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
      @media (prefers-color-scheme: dark) {
        html[data-local-file] body { background: #161c26; color: #e3eaf3; }
        #file-open-help { background: #202a38; border-color: #3b4b60; }
        #file-open-help .file-open-brand { color: #b5c3d5; }
        #file-open-help a { color: #9cc9f4; }
      }
    </style>
    <script>
      if (location.protocol === 'file:') {
        document.documentElement.dataset.localFile = 'true';
        document.getElementById('file-open-help').hidden = false;
        var language = navigator.language.startsWith('ja') ? 'ja' : navigator.language.startsWith('zh') ? 'zh-CN' : 'en';
        var messages = {
          en: ['Open this game using HTTP', 'Opening index.html directly prevents the browser from loading game scripts and assets.', 'In the release folder, double-click preview.cmd to start a local preview and open your browser.', 'Local preview requires Node.js. Keep the preview window open while playing; close it or press Ctrl+C to stop.', 'You can also host the entire release folder on a static website and open its HTTP or HTTPS address.', 'Read launch instructions'],
          ja: ['HTTP 経由でゲームを開いてください', 'index.html を直接開くと、ブラウザーがゲームのスクリプトや素材の読み込みを制限します。', '配布フォルダーの preview.cmd をダブルクリックすると、ローカルプレビューとブラウザーが起動します。', 'Node.js が必要です。プレイ中はプレビューウィンドウを開いたままにし、終了時に閉じるか Ctrl+C を押してください。', '配布フォルダー全体を静的サイトに配置し、HTTP または HTTPS のアドレスから開くこともできます。', '起動手順を見る']
        };
        if (messages[language]) ['title', 'reason', 'start', 'requirement', 'hosting', 'readme'].forEach(function (key, index) {
          document.getElementById('file-open-' + key).textContent = messages[language][index];
        });
        document.documentElement.lang = language;
        document.title = document.getElementById('file-open-title').textContent + ' · GalCraft';
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
